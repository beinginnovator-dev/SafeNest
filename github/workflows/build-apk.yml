name: Build SafeNest APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "SafeNest-Android-Project.zip" ]]; then
            unzip -q SafeNest-Android-Project.zip -d _android_project
            echo "PROJECT_DIR=_android_project/SafeNest-Android" >> "$GITHUB_ENV"
          elif [[ -f "settings.gradle" && -f "app/build.gradle" ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [[ -f "SafeNest-Android/settings.gradle" && -f "SafeNest-Android/app/build.gradle" ]]; then
            echo "PROJECT_DIR=SafeNest-Android" >> "$GITHUB_ENV"
          else
            echo "Could not find the SafeNest Android project or SafeNest-Android-Project.zip" >&2
            exit 1
          fi

      - name: Build installable debug APK
        shell: bash
        run: cd "$PROJECT_DIR" && gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNest-debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
