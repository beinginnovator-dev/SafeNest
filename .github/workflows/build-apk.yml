name: Build SafeNest APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not run setup-android here: the previous log shows it replacing
      # the runner's preinstalled command-line tools during version mismatch.
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at $SDK"
          test -d "$SDK"
          ls "$SDK"

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found in runner Android SDK." >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _extract
          found=""
          while IFS= read -r -d '' settings; do
            dir="$(dirname "$settings")"
            if [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]]; then
              found="$dir"; break
            fi
          done < <(find . -path './.git' -prune -o -path './_extract' -prune -o \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [[ -z "$found" ]]; then
            while IFS= read -r -d '' archive; do
              dest="_extract/zip_$RANDOM"
              mkdir -p "$dest"
              unzip -oq "$archive" -d "$dest" || true
            done < <(find . -path './.git' -prune -o -path './_extract' -prune -o -iname '*.zip' -print0)
            while IFS= read -r -d '' settings; do
              dir="$(dirname "$settings")"
              if [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]]; then
                found="$dir"; break
              fi
            done < <(find _extract -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)
          fi

          if [[ -z "$found" ]]; then
            echo "Android project not found. Upload the SafeNest Android project ZIP or extracted project folder." >&2
            find . -maxdepth 4 -type f | head -100 >&2
            exit 1
          fi
          echo "Found Android project at: $found"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/${found#./}" >> "$GITHUB_ENV"

      - name: Build installable debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNest-debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
