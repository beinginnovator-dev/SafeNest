name: Build SafeNest APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not run setup-android here: the previous log shows it replacing
      # the runner's preinstalled command-line tools during version mismatch.
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using Android SDK at $SDK"
          test -d "$SDK"
          ls "$SDK"

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found in runner Android SDK." >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _extract

          # Unpack ZIP files committed at repository root.
          while IFS= read -r -d '' archive; do
            dest="_extract/root_$(basename "$archive" .zip)_$RANDOM"
            mkdir -p "$dest"
            unzip -oq "$archive" -d "$dest"
          done < <(find . -maxdepth 2 -path './.git' -prune -o -path './_extract' -prune -o -iname '*.zip' -print0)

          # Build kits may contain another ZIP. Extract nested archives until
          # there are no ZIPs left under _extract.
          for pass in 1 2 3 4 5; do
            mapfile -d '' archives < <(find _extract -type f -iname '*.zip' -print0)
            [[ ${#archives[@]} -gt 0 ]] || break
            for archive in "${archives[@]}"; do
              [[ -f "$archive" ]] || continue
              dest="$(dirname "$archive")/$(basename "$archive" .zip)-unzipped"
              mkdir -p "$dest"
              echo "Extracting nested archive: $archive"
              unzip -oq "$archive" -d "$dest"
              rm -f "$archive"
            done
          done

          # Search both repository and all extracted directories for Gradle project.
          found=""
          while IFS= read -r -d '' settings; do
            dir="$(dirname "$settings")"
            if [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]]; then
              found="$dir"
              break
            fi
          done < <(find . -path './.git' -prune -o -path './_extract' -prune -o \( -name settings.gradle -o -name settings.gradle.kts \) -print0; find _extract -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [[ -z "$found" ]]; then
            echo "Android Gradle project not found after recursively extracting ZIPs." >&2
            echo "Found these Gradle settings files:" >&2
            find . -path './.git' -prune -o -name settings.gradle -print >&2 || true
            find _extract -name settings.gradle -print >&2 || true
            echo "Extracted files:" >&2
            find _extract -maxdepth 6 -type f | head -150 >&2
            exit 1
          fi

          echo "Found Android project at: $found"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/${found#./}" >> "$GITHUB_ENV"

      - name: Build installable debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeNest-debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
